name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Enviar ao TestFlight (precisa dos segredos da Apple)
        type: boolean
        default: false

jobs:
  simulator:
    name: Simulador sem assinatura
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependências
        run: npm ci
      - name: Xcode com SDK do iOS 26
        run: node scripts/select-xcode.mjs
      - name: Verificar o projeto
        run: npm run ios:check
      - name: Compilar para o simulador
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/Katecheo.xcodeproj \
            -scheme Katecheo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/katecheo-ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      - name: Testes do editor (KatecheoTests)
        run: |
          set -euo pipefail
          DEST="$(node -e '
            const {execSync}=require("child_process");
            const data=JSON.parse(execSync("xcrun simctl list devices available -j",{encoding:"utf8"}));
            const preferred=["iPhone 16","iPhone 16 Pro","iPhone 15","iPhone 15 Pro","iPhone SE"];
            const found=[];
            for (const [runtime, devices] of Object.entries(data.devices||{})) {
              if (!/iOS|iPhone/i.test(runtime)) continue;
              for (const d of devices) {
                if (d.isAvailable && String(d.name||"").startsWith("iPhone")) found.push(d.name);
              }
            }
            const pick = preferred.find((n)=>found.includes(n)) || found[0];
            if (!pick) { console.error("Nenhum iPhone Simulator disponível"); process.exit(1); }
            process.stdout.write("platform=iOS Simulator,name="+pick);
          ')"
          echo "Destino dos testes: $DEST"
          mkdir -p artifacts
          set +e
          xcodebuild \
            -project ios/App/Katecheo.xcodeproj \
            -scheme Katecheo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$DEST" \
            -derivedDataPath "${RUNNER_TEMP}/katecheo-ios" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test
          TEST_STATUS=$?
          set -e
          # KatecheoTests write PNGs inside the Simulator app sandbox — harvest even on failure.
          # Per-pattern finds (no shared head) so b238 is not crowded out by older tf/b234 PNGs.
          for pat in 'tf222-*.png' 'tab-bg-*.png' 'b234-*.png' 'b238-*.png' 'confirm-*.png' 'auth-*.png' 'onboarding-*.png'; do
            find \
              "${HOME}/Library/Developer/CoreSimulator" \
              "${RUNNER_TEMP}/katecheo-ios" \
              /tmp \
              "${GITHUB_WORKSPACE}" \
              -name "$pat" 2>/dev/null \
              | head -80 \
              | while read -r f; do cp -f "$f" artifacts/ 2>/dev/null || true; done
          done
          ls -la artifacts || true
          exit "$TEST_STATUS"
      - name: Upload speaker appearance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf222-speaker-appearance
          path: artifacts/tf222-*.png
          if-no-files-found: warn
      - name: Upload tab background screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-background-consistency
          path: artifacts/tab-bg-*.png
          if-no-files-found: error
      - name: Upload build-234 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-234-feedback
          path: artifacts/b234-*.png
          if-no-files-found: warn
      - name: Upload build-238 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-238-feedback
          path: artifacts/b238-*.png
          if-no-files-found: error
      - name: Upload confirmation dialog screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmation-dialogs
          path: artifacts/confirm-*.png
          if-no-files-found: error
      - name: Upload auth screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-signin-create-account
          path: artifacts/auth-*.png
          if-no-files-found: error
      - name: Upload onboarding screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-first-launch
          path: artifacts/onboarding-*.png
          if-no-files-found: error

  testflight:
    name: Assinar e enviar ao TestFlight
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependências
        run: npm ci
      - name: Xcode com SDK do iOS 26
        run: node scripts/select-xcode.mjs
      - name: Confirmar segredos
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Segredo em falta: $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Nada foi enviado. Veja a secção App iOS do README."
            exit 1
          fi
      - name: Importar certificado e perfil
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/katecheo.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/distribution.p12"
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/Katecheo.xcodeproj \
            -scheme Katecheo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Katecheo.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive
      - name: Exportar IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.verse2note.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Katecheo.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Enviar ao TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 -D > "$KEY_PATH"
          fi
          IPA="$(echo "$RUNNER_TEMP"/ipa/*.ipa)"
          if xcrun altool --help >/dev/null 2>&1; then
            xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          else
            xcrun iTMSTransporter -m upload -assetFile "$IPA" -apiKey "$APP_STORE_CONNECT_KEY_ID" -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
          rm -f "$KEY_PATH"
